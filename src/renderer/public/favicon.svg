<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Chud Tiles: a ringed planet holding two tiles, on a night-sky plate. The single source of
       every icon (npm run make:icons). -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fd6ff" />
      <stop offset="0.55" stop-color="#8f6bff" />
      <stop offset="1" stop-color="#ff5fd2" />
    </linearGradient>
    <radialGradient id="sky" cx="0.5" cy="0.4" r="0.78">
      <stop offset="0" stop-color="#1d1658" />
      <stop offset="0.55" stop-color="#0b0c2c" />
      <stop offset="1" stop-color="#04050f" />
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8f6bff" stop-opacity="0.6" />
      <stop offset="1" stop-color="#8f6bff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fd6ff" stop-opacity="0.55" />
      <stop offset="1" stop-color="#ff5fd2" stop-opacity="0.35" />
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#sky)" />
  <rect x="19" y="19" width="474" height="474" rx="109" fill="none" stroke="url(#rim)" stroke-width="6" />
  <g fill="#ffffff">
    <circle cx="96" cy="110" r="4" opacity="0.8" />
    <circle cx="410" cy="92" r="3" opacity="0.7" />
    <circle cx="430" cy="380" r="4" opacity="0.6" />
    <circle cx="120" cy="410" r="3" opacity="0.55" />
    <circle cx="372" cy="160" r="2.5" opacity="0.6" />
    <circle cx="70" cy="270" r="2.5" opacity="0.5" />
  </g>
  <g transform="translate(256 256) scale(9.2) translate(-24 -24)">
    <circle cx="24" cy="24" r="22" fill="url(#glow)" />
    <!-- the ring passes behind the planet: drawn in two halves -->
    <path d="M4.6 30.2 A21 7 -24 0 1 41.6 13.5" fill="none" stroke="url(#g)" stroke-width="1.8" opacity="0.55" />
    <circle cx="24" cy="24" r="12" fill="#0a0c24" stroke="url(#g)" stroke-width="2.4" />
    <rect x="18.2" y="16.5" width="3.4" height="9.5" rx="1.7" fill="#ffffff" />
    <rect x="26.4" y="21.5" width="3.4" height="9.5" rx="1.7" fill="url(#g)" />
    <path d="M41.6 13.5 A21 7 -24 0 1 4.6 30.2" fill="none" stroke="url(#g)" stroke-width="1.8" />
  </g>
</svg>
