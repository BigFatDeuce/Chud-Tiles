# Checks every push and pull request: types, unit tests, translations, desktop and web builds.
# The end-to-end suites (real app, YouTube) run locally: see README.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # the checks build the bundles only; the Electron binary is not needed
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:i18n
      - run: npm run build
      - run: npm run web:build
